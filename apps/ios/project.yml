name: Showcase
options:
  bundleIdPrefix: com.playerlab
  createIntermediateGroups: true
  # Local.xcconfig is generated (untracked) by scripts/sync-env.sh from the
  # repo-root .env; allow generating the project without it (CI builds licenseless).
  disabledValidations: [missingConfigFiles]

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

packages:
  BitmovinPlayer:
    url: https://github.com/bitmovin/player-ios.git
    exactVersion: "3.128.0"
  DvrKit:
    path: DvrKit

settings:
  base:
    # Swift 5 language mode keeps the scaffold off Swift 6 strict-concurrency
    # until the app is built and tuned in Xcode.
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Showcase-iOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Showcase
      # The shared Web UI bundle (synced from packages/ui-shared/dist by
      # scripts/sync-webui-bundle.sh) is bundled as an app resource so the iOS Web UI can load
      # it (§12). `optional` so `xcodegen generate` works before the first sync. tvOS omits this —
      # it uses the native System UI, where the Web UI is unavailable.
      - path: WebUI
        buildPhase: resources
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Showcase/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.ios
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: BitmovinPlayer
        product: BitmovinPlayer
      - package: DvrKit

  Showcase-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "15.0"
    sources: [Showcase]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Showcase/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.tvos
    dependencies:
      - package: BitmovinPlayer
        product: BitmovinPlayer
      - package: DvrKit

  Showcase-iOSRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources: [ShowcaseTests]
    dependencies:
      - target: Showcase-iOS
      - package: BitmovinPlayer
        product: BitmovinPlayer
      - package: DvrKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.ios.tests.runtime
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Showcase-iOS.app/Showcase-iOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Showcase-iOSConfigurationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    # Hostless tests compile the exact shared app model files. Starting the app
    # itself without a native license is a fatal SDK precondition.
    sources:
      - ShowcaseConfigurationTests
      - Showcase/Configuration.swift
      - Showcase/AdvancedConfiguration.swift
      - Showcase/ConfigurationCode.swift
      - Showcase/TrackPreferences.swift
      - Showcase/PlayerModel.swift
      - Showcase/Sources.swift
    dependencies:
      - package: BitmovinPlayer
        product: BitmovinPlayer
      - package: DvrKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.ios.tests.configuration

  Showcase-iOSTrackRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources: [ShowcaseTrackRuntimeTests]
    dependencies:
      - target: Showcase-iOS
      - package: BitmovinPlayer
        product: BitmovinPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.ios.tests.tracks
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Showcase-iOS.app/Showcase-iOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Showcase-tvOSTrackRuntimeTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "15.0"
    sources: [ShowcaseTrackRuntimeTests]
    dependencies:
      - target: Showcase-tvOS
      - package: BitmovinPlayer
        product: BitmovinPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.tvos.tests.tracks
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Showcase-tvOS.app/Showcase-tvOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Showcase-iOSFinalizationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources: [ShowcaseFinalizationTests]
    dependencies:
      - target: Showcase-iOS
      - package: BitmovinPlayer
        product: BitmovinPlayer
      - package: DvrKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.ios.tests.finalization
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Showcase-iOS.app/Showcase-iOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Showcase-tvOSFinalizationTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "15.0"
    sources: [ShowcaseFinalizationTests]
    dependencies:
      - target: Showcase-tvOS
      - package: BitmovinPlayer
        product: BitmovinPlayer
      - package: DvrKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.tvos.tests.finalization
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Showcase-tvOS.app/Showcase-tvOS"
        BUNDLE_LOADER: "$(TEST_HOST)"

  Showcase-tvOSConfigurationTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "15.0"
    sources:
      - ShowcaseConfigurationTests
      - Showcase/Configuration.swift
      - Showcase/AdvancedConfiguration.swift
      - Showcase/ConfigurationCode.swift
      - Showcase/TrackPreferences.swift
      - Showcase/PlayerModel.swift
      - Showcase/Sources.swift
    dependencies:
      - package: BitmovinPlayer
        product: BitmovinPlayer
      - package: DvrKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.tvos.tests.configuration

  Showcase-iOSConfigurationUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources: [ShowcaseConfigurationUITests]
    dependencies:
      - target: Showcase-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.ios.tests.configurationui

  Showcase-tvOSConfigurationUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "15.0"
    sources: [ShowcaseConfigurationUITests]
    dependencies:
      - target: Showcase-tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playerlab.tvos.tests.configurationui

# Keep app build schemes alongside the opt-in runtime scheme for command-line builds.
schemes:
  Showcase-iOS:
    build:
      targets:
        Showcase-iOS: all
  Showcase-tvOS:
    build:
      targets:
        Showcase-tvOS: all
  Showcase-iOS-Runtime:
    build:
      targets:
        Showcase-iOS: all
    test:
      targets: [Showcase-iOSRuntimeTests]
  Showcase-iOS-Configuration:
    build:
      targets:
        Showcase-iOS: all
    test:
      targets: [Showcase-iOSConfigurationTests]
  Showcase-iOS-Finalization:
    build:
      targets:
        Showcase-iOS: all
    test:
      targets: [Showcase-iOSFinalizationTests]
  Showcase-tvOS-Finalization:
    build:
      targets:
        Showcase-tvOS: all
    test:
      targets: [Showcase-tvOSFinalizationTests]
  Showcase-tvOS-Configuration:
    build:
      targets:
        Showcase-tvOS: all
    test:
      targets: [Showcase-tvOSConfigurationTests]
  Showcase-iOS-ConfigurationUI:
    build:
      targets:
        Showcase-iOS: all
    test:
      targets: [Showcase-iOSConfigurationUITests]
  Showcase-tvOS-ConfigurationUI:
    build:
      targets:
        Showcase-tvOS: all
    test:
      targets: [Showcase-tvOSConfigurationUITests]
  Showcase-iOS-TrackQualification:
    build:
      targets:
        Showcase-iOS: all
    test:
      targets: [Showcase-iOSTrackRuntimeTests, Showcase-iOSConfigurationUITests]
  Showcase-tvOS-TrackQualification:
    build:
      targets:
        Showcase-tvOS: all
    test:
      targets: [Showcase-tvOSTrackRuntimeTests, Showcase-tvOSConfigurationUITests]
