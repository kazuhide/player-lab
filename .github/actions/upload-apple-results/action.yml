name: Retain a completed Apple result bundle
description: Guard at most one additional non-destructive upload stage for the same result bytes.
inputs:
  platform:
    description: ios or tvos
    required: true
outputs:
  artifact-id:
    description: Finalized original artifact ID
    value: ${{ steps.finish.outputs.artifact-id }}
  artifact-digest:
    description: SHA256 of the action-created artifact ZIP
    value: ${{ steps.finish.outputs.artifact-digest }}
  content-digest:
    description: SHA256 of the sealed regular-member manifest, distinct from the ZIP digest
    value: ${{ steps.finish.outputs.content-digest }}
runs:
  using: composite
  steps:
    - id: seal
      if: ${{ !cancelled() }}
      shell: bash
      env:
        RESULT_PLATFORM: ${{ inputs.platform }}
        EVIDENCE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        EVIDENCE_HELPER: ${{ github.action_path }}/../../../scripts/apple-result-evidence.py
      run: python3 "$EVIDENCE_HELPER" seal --platform "$RESULT_PLATFORM"
    - id: first
      if: ${{ !cancelled() && steps.seal.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.seal.outputs.artifact-name }}
        path: ${{ steps.seal.outputs.bundle-path }}
        if-no-files-found: error
        overwrite: false
        retention-days: 7
    - id: guard
      if: ${{ !cancelled() && steps.seal.outcome == 'success' && steps.first.outcome == 'failure' }}
      shell: bash
      env:
        RESULT_PLATFORM: ${{ inputs.platform }}
        EVIDENCE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        EVIDENCE_HELPER: ${{ github.action_path }}/../../../scripts/apple-result-evidence.py
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 "$EVIDENCE_HELPER" guard --platform "$RESULT_PLATFORM"
    - id: second
      if: ${{ !cancelled() && steps.first.outcome == 'failure' && steps.guard.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.seal.outputs.artifact-name }}
        path: ${{ steps.seal.outputs.bundle-path }}
        if-no-files-found: error
        overwrite: false
        retention-days: 7
    - id: finish
      if: always()
      shell: bash
      env:
        RESULT_PLATFORM: ${{ inputs.platform }}
        EVIDENCE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        EVIDENCE_HELPER: ${{ github.action_path }}/../../../scripts/apple-result-evidence.py
        FIRST_OUTCOME: ${{ steps.first.outcome }}
        FIRST_ARTIFACT_ID: ${{ steps.first.outputs.artifact-id }}
        FIRST_ARTIFACT_DIGEST: ${{ steps.first.outputs.artifact-digest }}
        GUARD_OUTCOME: ${{ steps.guard.outcome }}
        SECOND_OUTCOME: ${{ steps.second.outcome }}
        SECOND_ARTIFACT_ID: ${{ steps.second.outputs.artifact-id }}
        SECOND_ARTIFACT_DIGEST: ${{ steps.second.outputs.artifact-digest }}
      run: python3 "$EVIDENCE_HELPER" finish --platform "$RESULT_PLATFORM"
