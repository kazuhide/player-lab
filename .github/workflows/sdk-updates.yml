name: SDK updates

on:
  schedule:
    - cron: '35 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release-monitor
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.report.outputs.available }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the current inventory and release-channel parser
        run: |
          python3 scripts/test-sdk-updates.py
          python3 scripts/check-api-coverage.py
      - name: Inspect official release channels
        id: report
        env:
          REPORT_DIR: ${{ runner.temp }}/sdk-updates
        run: |
          python3 scripts/check-sdk-updates.py --output "$REPORT_DIR/releases.json" --markdown "$REPORT_DIR/releases.md"
          node scripts/api-coverage/capture-installed.cjs "$REPORT_DIR/baseline.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['REPORT_DIR']) / 'releases.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('available=' + str(report['updateAvailable']).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write((Path(os.environ['REPORT_DIR']) / 'releases.md').read_text())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-release-metadata
          path: ${{ runner.temp }}/sdk-updates
          if-no-files-found: error
          retention-days: 14

  propose:
    needs: inspect
    if: needs.inspect.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Keep an existing update PR intact
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --limit 1000 --json headRefName,url > "$RUNNER_TEMP/open-prs.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pending = [row for row in json.loads((Path(os.environ['RUNNER_TEMP']) / 'open-prs.json').read_text())
                     if row['headRefName'].startswith('automation/player-sdk-update-')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('exists=' + str(bool(pending)).lower() + '\n')
          if pending:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('An SDK update is already in progress: ' + pending[0]['url'] + '\n')
          PY
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.pending.outputs.exists != 'true'
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.pending.outputs.exists != 'true'
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pending.outputs.exists != 'true'
        with:
          name: sdk-release-metadata
          path: ${{ runner.temp }}/sdk-updates
      - name: Prepare exact candidate dependency pins
        if: steps.pending.outputs.exists != 'true'
        run: python3 scripts/prepare-sdk-update.py --report "$RUNNER_TEMP/sdk-updates/releases.json" --body "$RUNNER_TEMP/sdk-updates/pr.md" --write
      - name: Resolve candidate JavaScript dependencies
        id: resolution
        if: steps.pending.outputs.exists != 'true'
        continue-on-error: true
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm --dir apps/react-native/expo install --lockfile-only --ignore-workspace --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/api-coverage/capture-installed.cjs "$RUNNER_TEMP/sdk-updates/candidate.json"
          python3 scripts/check-sdk-updates.py --baseline "$RUNNER_TEMP/sdk-updates/baseline.json" --candidate "$RUNNER_TEMP/sdk-updates/candidate.json" --output "$RUNNER_TEMP/sdk-updates/api-diff.json"
      - name: Describe candidate declaration changes and remaining update gates
        if: steps.pending.outputs.exists != 'true'
        env:
          RESOLUTION_RESULT: ${{ steps.resolution.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from sdk_updates import release_markdown
          folder = Path(os.environ['RUNNER_TEMP']) / 'sdk-updates'
          report = json.loads((folder / 'releases.json').read_text())
          delta = json.loads((folder / 'api-diff.json').read_text()) if (folder / 'api-diff.json').exists() else None
          body = release_markdown(report, delta)
          if os.environ['RESOLUTION_RESULT'] != 'success':
              body += '\nCandidate dependency resolution or extraction failed. Resolve the recorded workflow failure before reviewing the API mapping or merging.\n'
          body += '\n[Release metadata and candidate extraction artifacts](' + os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + ')\n'
          (folder / 'pr.md').write_text(body)
          PY
      - name: Open a draft and explicitly dispatch its CI
        if: steps.pending.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/player-sdk-update-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json packages/ui-shared/package.json tests/e2e/package.json apps/react-native/package.json apps/react-native/expo/package.json apps/vega/package.json apps/android/app/build.gradle.kts apps/ios/project.yml pnpm-lock.yaml apps/react-native/expo/pnpm-lock.yaml
          git commit -m 'Prepare Player SDK release updates'
          gh auth setup-git
          git push --set-upstream origin "$branch"
          gh pr create --draft --base main --head "$branch" --title 'Update Player SDK releases' --body-file "$RUNNER_TEMP/sdk-updates/pr.md"
          gh workflow run ci.yml --ref "$branch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.pending.outputs.exists != 'true'
        with:
          name: sdk-update-candidate
          path: ${{ runner.temp }}/sdk-updates
          if-no-files-found: error
          retention-days: 14
