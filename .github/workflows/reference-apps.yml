name: Reference applications

on:
  pull_request:
    paths:
      - 'references/elearning/**'
      - '.github/workflows/reference-apps.yml'
  push:
    branches: [main]
    paths:
      - 'references/elearning/**'
      - '.github/workflows/reference-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elearning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: references/elearning
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Check bilingual documentation and its validator
        working-directory: references/elearning
        run: |
          python3 -B -m unittest discover -s tools/docs -p 'test_*.py'
          python3 -B tools/docs/check_docs.py
      - name: Test the fixture publisher and its input contracts
        working-directory: references/elearning
        run: |
          python3 -B -m unittest discover -s tools/media -p 'test_*.py'
          python3 -B -m unittest discover -s android/scripts/tests -p 'test_*.py'
      - name: Test and check the independent analytics application
        working-directory: references/elearning/analytics-dashboard
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: Test dashboard browser interactions without credentials
        working-directory: references/elearning/analytics-dashboard
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Upload dashboard browser failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elearning-dashboard-browser-failures
          path: references/elearning/analytics-dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install the Android compile platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' >/dev/null
      - name: Test, lint and compile Android without credentials
        working-directory: references/elearning/android
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          python3 scripts/check_junit_signatures.py
