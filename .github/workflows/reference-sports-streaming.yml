name: Sports streaming reference

on:
  pull_request:
    paths:
      - 'references/sports-streaming/**'
      - '.github/workflows/reference-sports-streaming.yml'
  push:
    branches: [main]
    paths:
      - 'references/sports-streaming/**'
      - '.github/workflows/reference-sports-streaming.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sports-streaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: references/sports-streaming
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Check bilingual documentation and its validator
        working-directory: references/sports-streaming
        run: |
          python3 -B -m unittest discover -s tools/docs -p 'test_*.py'
          python3 -B tools/docs/check_docs.py
      - name: Test the fixture publisher and its input contracts
        working-directory: references/sports-streaming
        run: |
          python3 -B -m unittest discover -s tools/media -p 'test_*.py'
          python3 -B -m unittest discover -s android/tools -p 'test_*.py'
      - name: Test and build the playback Web app
        working-directory: references/sports-streaming/web
        run: |
          npm ci
          npm test
          npm run build
      - name: Test and check the independent analytics application
        working-directory: references/sports-streaming/analytics-web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: Test dashboard browser interactions without credentials
        working-directory: references/sports-streaming/analytics-web
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Upload dashboard browser failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sports-streaming-dashboard-browser-failures
          path: references/sports-streaming/analytics-web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install the Android compile platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' >/dev/null
      - name: Test, lint and compile Android without credentials
        working-directory: references/sports-streaming/android
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          python3 tools/check-instrumentation-classes.py

  apple:
    name: Sports iOS and tvOS
    runs-on: macos-26
    defaults:
      run:
        working-directory: references/sports-streaming/apple
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: references/sports-streaming
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          printf '%s  %s\n' 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-tool"
          echo "$RUNNER_TEMP/xcodegen-tool/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Test playback rules and build simulator apps
        run: |
          swift test
          xcodegen generate
          xcodebuild -project Sports.xcodeproj -scheme Sports-iOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing
          xcodebuild -project Sports.xcodeproj -scheme Sports-tvOS -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing
