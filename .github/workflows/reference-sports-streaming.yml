name: Sports streaming reference

on:
  pull_request:
    paths:
      - 'references/sports-streaming/**'
      - '.github/workflows/reference-sports-streaming.yml'
  push:
    branches: [main]
    paths:
      - 'references/sports-streaming/**'
      - '.github/workflows/reference-sports-streaming.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sports-streaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: references/sports-streaming
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Test the fixture publisher and its input contracts
        working-directory: references/sports-streaming
        run: |
          python3 -B -m unittest discover -s tools/media -p 'test_*.py'
          python3 -B -m unittest discover -s android/tools -p 'test_*.py'
      - name: Test and check the independent analytics application
        working-directory: references/sports-streaming/analytics-web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: Install the Android compile platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' >/dev/null
      - name: Test, lint and compile Android without credentials
        working-directory: references/sports-streaming/android
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          python3 tools/check-instrumentation-classes.py
