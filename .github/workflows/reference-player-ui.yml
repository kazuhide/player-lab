name: Player UI reference

on:
  pull_request:
    paths:
      - 'references/player-ui/**'
      - '.github/workflows/reference-player-ui.yml'
  push:
    branches: [main]
    paths:
      - 'references/player-ui/**'
      - '.github/workflows/reference-player-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-player-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: references/player-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: references/player-ui
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: references/player-ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test interval aggregation and timeline geometry
        run: npm test
      - name: Check committed snapshots, types and production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check playback and interface interactions
        run: npm run test:browser
      - name: Retain browser failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-ui-reference-browser-failures
          path: |
            references/player-ui/test-results/
            references/player-ui/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
