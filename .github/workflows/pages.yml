name: Publish project overview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.current.outputs.publish }}
      sha: ${{ steps.current.outputs.sha }}
    steps:
      - name: Check the successful CI commit is still current
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/ci.yml' ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error('Pages requires a completed main CI run from this repository.');
            }
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            core.setOutput('sha', run.head_sha);
            core.setOutput('publish', branch.commit.sha === run.head_sha ? 'true' : 'false');
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.current.outputs.publish == 'true'
        with:
          ref: ${{ steps.current.outputs.sha }}
          persist-credentials: false
      - name: Check the public site artifact contains only its intended files
        if: steps.current.outputs.publish == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('site')
          expected = {'index.html', 'styles.css', 'assets/player-preview.jpg', 'assets/favicon.svg'}
          if root.is_symlink() or not root.is_dir():
              raise SystemExit('The Pages source must be the site directory.')
          entries = list(root.rglob('*'))
          if any(path.is_symlink() or (path.is_file() and path.stat().st_nlink != 1) for path in entries):
              raise SystemExit('The Pages artifact must not contain links.')
          actual = {str(path.relative_to(root)) for path in entries if path.is_file()}
          if actual != expected:
              raise SystemExit('The Pages artifact contains missing or unexpected files.')
          PY
      - name: Upload the static project overview
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck main after waiting for an earlier deployment
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SHA: ${{ needs.package.outputs.sha }}
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            core.setOutput('publish', branch.commit.sha === process.env.EXPECTED_SHA ? 'true' : 'false');
      - name: Deploy the checked artifact to GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
