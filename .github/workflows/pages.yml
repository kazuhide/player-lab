name: Publish project overview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.current.outputs.publish }}
      sha: ${{ steps.current.outputs.sha }}
    steps:
      - name: Check the successful CI commit is still current
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/ci.yml' ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error('Pages requires a completed main CI run from this repository.');
            }
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            core.setOutput('sha', run.head_sha);
            core.setOutput('publish', branch.commit.sha === run.head_sha ? 'true' : 'false');
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.current.outputs.publish == 'true'
        with:
          ref: ${{ steps.current.outputs.sha }}
          persist-credentials: false
      - name: Download the files tested by the successful main CI run
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-release
          path: ${{ runner.temp }}/pages-release
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check the tested release and its public file manifest
        if: steps.current.outputs.publish == 'true'
        env:
          EXPECTED_SHA: ${{ steps.current.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pages-release'
          if {path.name for path in root.iterdir()} != {'site', 'manifest.json', 'release.json'}:
              raise SystemExit('The tested release contains unexpected entries.')
          for name in ['release.json', 'manifest.json']:
              metadata = (root / name).lstat()
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1:
                  raise SystemExit('Release metadata must be regular files without links.')
          release = json.loads((root / 'release.json').read_text(encoding='utf-8'))
          expected = {'sha': os.environ['EXPECTED_SHA'], 'base': '/player-lab/web/',
                      'publicPlayerKeyConfigured': True, 'publicAnalyticsKeyConfigured': True}
          if release != expected:
              raise SystemExit('Pages requires the tested main commit and explicitly configured public Player and Analytics keys.')
          PY
          python3 scripts/package-pages.py --verify-dir "$RUNNER_TEMP/pages-release/site" \
            --manifest "$RUNNER_TEMP/pages-release/manifest.json"
      - name: Upload the tested project overview and Web app
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages-release/site
          retention-days: 1

  deploy:
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
      # Preserve newer pending deployments when an older artifact finishes uploading later.
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck main after waiting for an earlier deployment
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SHA: ${{ needs.package.outputs.sha }}
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main'
            });
            core.setOutput('publish', branch.commit.sha === process.env.EXPECTED_SHA ? 'true' : 'false');
      - name: Deploy the checked artifact to GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
