name: Publish release to Pages
run-name: Pages release ${{ inputs.release_id }} from ${{ inputs.producer_run_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Numeric ID of an immutable published release
        required: true
        type: string
      producer_run_id:
        description: Automatic producer run ID; leave empty for a manual request
        required: false
        default: ''
        type: string
      allow_older_release:
        description: Explicitly restore an older formal release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      state_artifact: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
      pages_artifact: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the immutable release, signed CI archive and retained file manifest
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          ALLOW_OLDER_RELEASE: ${{ inputs.allow_older_release && 'true' || 'false' }}
        run: |
          python3 scripts/release_pipeline.py prepare-pages \
            --release-id "$RELEASE_ID" --producer-run-id "$PRODUCER_RUN_ID" \
            --allow-older-release "$ALLOW_OLDER_RELEASE" --work-dir "$RUNNER_TEMP/release-pages"
      - name: Retain the verified identity for the deployment gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release.outputs.state }}
          if-no-files-found: error
          retention-days: 1
      - name: Upload the retained and verified public files without rebuilding
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release.outputs.site }}
          retention-days: 1

  deploy:
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.package.outputs.state_artifact }}
          path: ${{ runner.temp }}/release-state
      - name: Recheck immutable assets and request ordering immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_pipeline.py recheck-pages \
            --state-file "$RUNNER_TEMP/release-state/verified-release.json"
      - name: Deploy the checked formal release to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.package.outputs.pages_artifact }}
