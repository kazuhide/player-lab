name: CI

# Run the existing workspace checks and native builds for each pull request.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -r --if-present run typecheck

      - name: Test
        run: pnpm -r --if-present run test

      - name: Build
        run: pnpm -r --if-present run build

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test DvrKit
        run: swift test --package-path apps/ios/DvrKit
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare an empty local configuration for compilation
        run: touch apps/ios/Local.xcconfig
      - name: Generate Xcode project
        run: cd apps/ios && xcodegen generate
      - name: Build iOS app (simulator)
        run: |
          cd apps/ios && xcodebuild \
            -project Showcase.xcodeproj -scheme Showcase-iOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build tvOS app (simulator)
        run: |
          cd apps/ios && xcodebuild \
            -project Showcase.xcodeproj -scheme Showcase-tvOS \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Test :dvr, build the app, compile the instrumented test
        # ANDROID_HOME is set on the runner, so settings.gradle.kts includes :app.
        # assembleDebugAndroidTest compiles the on-device integration test (running
        # it needs an emulator + a license keyed to com.showcase.dvr).
        run: cd apps/android && ./gradlew :dvr:test :app:assembleDebug :app:assembleDebugAndroidTest -PbitmovinLicenseKey=dummy
