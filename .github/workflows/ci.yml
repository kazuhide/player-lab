name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test publication checks
        run: python3 scripts/test-publication.py
      - name: Check tracked files and commit history
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [[ -n "$CHECK_BASE" && ! "$CHECK_BASE" =~ ^0+$ ]]; then
            args+=(--base "$CHECK_BASE")
          fi
          python3 scripts/check-publication.py "${args[@]}"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check SDK versions and API coverage
        run: |
          python3 scripts/test-api-coverage.py
          node --test scripts/api-coverage/extract-sdk-surface.test.cjs
          python3 scripts/api-coverage/apple/test_normalize_apple.py
          python3 scripts/check-api-coverage.py
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Correctness worker budget tests
        run: pnpm --filter @showcase/e2e test:workers
      - name: Test environment loading and bundle verification
        run: |
          bash scripts/test-env-lib.sh
          python3 scripts/test-native-ui.py
          python3 scripts/test-local-media.py
          python3 scripts/test-pages-package.py
          python3 scripts/test-user-guide.py
          python3 tests/e2e/test-serve-pages.py
      - name: Test Encoding resource resolution and credential handling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext-base jq
          python3 -m venv "$RUNNER_TEMP/encoding-venv"
          "$RUNNER_TEMP/encoding-venv/bin/python" -m pip install -r encoding/requirements.txt
          "$RUNNER_TEMP/encoding-venv/bin/python" scripts/test-encoding.py
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-web-ui
          path: |
            packages/ui-shared/dist/bitmovinplayer-ui.js
            packages/ui-shared/dist/bitmovinplayer-ui.css
          if-no-files-found: error
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser
        run: pnpm --filter @showcase/e2e exec playwright install --with-deps chromium
      - name: Check public playback and the existing GUI
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: pnpm --filter @showcase/e2e e2e:public
      - name: Install local media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Generate the verified public test fixture
        run: python3 encoding/test-streams/local.py --output "$RUNNER_TEMP/test-streams" --source-archive "$RUNNER_TEMP/source-cache/BigBuckBunny_640x360.m4v.zip"
      - name: Check audio, subtitles, thumbnails and network controls
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: E2E_MEDIA_DIR="$RUNNER_TEMP/test-streams" pnpm --filter @showcase/e2e e2e:features
      - name: Check controlled HLS and DASH event finalization
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: E2E_FINALIZATION_MEDIA_DIR="$RUNNER_TEMP/test-streams/vod-baseline" pnpm --filter @showcase/e2e e2e:finalization
      - name: Build the isolated Pages release
        env:
          # This variable is intentionally public: the value is delivered to browsers.
          PLAYER_LAB_PUBLIC_PLAYER_LICENSE_KEY: ${{ vars.PLAYER_LAB_PUBLIC_PLAYER_LICENSE_KEY }}
          PLAYER_LAB_PUBLIC_ANALYTICS_LICENSE_KEY: ${{ vars.PLAYER_LAB_PUBLIC_ANALYTICS_LICENSE_KEY }}
          BITMOVIN_API_KEY: pages-build-private-canary-account
          BITMOVIN_PLAYER_LICENSE_KEY: pages-build-private-canary-player
          VITE_BITMOVIN_PLAYER_LICENSE_KEY: pages-build-private-canary-vite-player
          VITE_BITMOVIN_ANALYTICS_LICENSE_KEY: pages-build-private-canary-analytics
          VITE_LIVE_HLS_URL: https://example.invalid/pages-build-private-canary.m3u8
          VITE_UNEXPECTED_VALUE: pages-build-private-canary-extra
        run: |
          mkdir "$RUNNER_TEMP/pages-release"
          bash scripts/build-pages.sh "$RUNNER_TEMP/test-streams" \
            "$RUNNER_TEMP/pages-release/site" "$RUNNER_TEMP/pages-release/manifest.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pages-release'
          if any(b'pages-build-private-canary' in path.read_bytes()
                 for path in (root / 'site').rglob('*') if path.is_file()):
              raise SystemExit('Unselected environment values entered the Pages build.')
          (root / 'release.json').write_text(json.dumps({
              'sha': os.environ['GITHUB_SHA'],
              'base': '/player-lab/web/',
              'publicPlayerKeyConfigured': bool(os.environ.get('PLAYER_LAB_PUBLIC_PLAYER_LICENSE_KEY', '').strip()),
              'publicAnalyticsKeyConfigured': bool(os.environ.get('PLAYER_LAB_PUBLIC_ANALYTICS_LICENSE_KEY', '').strip()),
          }) + '\n', encoding='utf-8')
          PY
      - name: Scan the actual Pages release with Gitleaks 8.30.1
        env:
          PLAYER_LAB_PUBLIC_PLAYER_LICENSE_KEY: ${{ vars.PLAYER_LAB_PUBLIC_PLAYER_LICENSE_KEY }}
          PLAYER_LAB_PUBLIC_ANALYTICS_LICENSE_KEY: ${{ vars.PLAYER_LAB_PUBLIC_ANALYTICS_LICENSE_KEY }}
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          python3 scripts/test-pages-secrets.py --gitleaks "$RUNNER_TEMP/gitleaks"
          python3 scripts/scan-pages-secrets.py --artifact-dir "$RUNNER_TEMP/pages-release" --gitleaks "$RUNNER_TEMP/gitleaks"
      - name: Check the production Pages app at its project URL
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
          E2E_PAGES_DIR: ${{ runner.temp }}/pages-release/site
          E2E_PAGES_ANALYTICS_ENABLED: ${{ vars.PLAYER_LAB_PUBLIC_ANALYTICS_LICENSE_KEY != '' && '1' || '0' }}
        run: pnpm --filter @showcase/e2e e2e:pages
      - name: Verify the tested Pages files before upload
        run: python3 scripts/package-pages.py --verify-dir "$RUNNER_TEMP/pages-release/site" --manifest "$RUNNER_TEMP/pages-release/manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-release
          path: ${{ runner.temp }}/pages-release
          if-no-files-found: error
          retention-days: 1

  ios:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-web-ui
          path: packages/ui-shared/dist
      - name: Sync existing shared UI resources
        run: bash scripts/sync-webui-bundle.sh
      - name: Test DvrKit
        run: swift test --package-path apps/ios/DvrKit
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          printf '%s  %s\n' 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-tool"
          echo "$RUNNER_TEMP/xcodegen-tool/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Prepare an empty local configuration for compilation
        run: touch apps/ios/Local.xcconfig
      - name: Generate Xcode project
        run: cd apps/ios && xcodegen generate
      - name: Restore resolved SDK versions
        run: |
          mkdir -p apps/ios/Showcase.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp apps/ios/Package.resolved apps/ios/Showcase.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Test iOS configuration without an app license
        run: |
          simulator_id="$(python3 - <<'PY'
          import json
          import subprocess
          inventory = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], text=True))
          for runtime, devices in inventory['devices'].items():
              if '.iOS-' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator was found for the iOS configuration tests.')
          PY
          )"
          cd apps/ios
          xcodebuild \
            -project Showcase.xcodeproj -scheme Showcase-iOS-Configuration \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/ios-configuration-tests" \
            -onlyUsePackageVersionsFromResolvedFile \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test
      - name: Build iOS app (simulator)
        run: |
          cd apps/ios && xcodebuild \
            -project Showcase.xcodeproj -scheme Showcase-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check packaged iOS shared UI
        run: python3 scripts/check-native-ui.py "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/Showcase-iOS.app"
      - name: Build tvOS app (simulator)
        run: |
          cd apps/ios && xcodebuild \
            -project Showcase.xcodeproj -scheme Showcase-tvOS \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO build

  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-web-ui
          path: packages/ui-shared/dist
      - name: Sync existing shared UI resources
        run: bash scripts/sync-webui-bundle.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
      - name: Test DVR and configuration, build the app, compile the instrumented test
        run: cd apps/android && ./gradlew :dvr:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest -PbitmovinLicenseKey=dummy
      - name: Check packaged Android shared UI
        run: python3 scripts/check-native-ui.py apps/android/app/build/outputs/apk/debug/app-debug.apk
