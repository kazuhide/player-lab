# VOD baseline test stream — H.264 fixed ladder (360p/480p) + AAC, fmp4,
# default DASH + HLS. Encodes a public sample (BigBuckBunny) to the showcase S3
# output. One-shot encode (no ongoing cost; the output persists and is reused by
# the E2E suite). Placeholders ${INPUT_ID} / ${INPUT_PATH} / ${OUTPUT_ID} are
# filled by provision.sh (resolved from the account, never committed).
metadata:
  type: VOD
  name: test-streams-vod-baseline

configurations:
  video:
    h264:
      v-360p:
        properties:
          name: vod-baseline 360p
          profile: MAIN
          height: 360
          bitrate: 800000
      v-480p:
        properties:
          name: vod-baseline 480p
          profile: MAIN
          height: 480
          bitrate: 1400000

encodings:
  main:
    properties:
      name: test-streams-vod-baseline
      encoderVersion: STABLE
    streams:
      s-360p:
        properties:
          inputStreams:
            - inputId: ${INPUT_ID}
              inputPath: ${INPUT_PATH}
              selectionMode: AUTO
          codecConfigId: $/configurations/video/h264/v-360p
          mode: STANDARD
      s-480p:
        properties:
          inputStreams:
            - inputId: ${INPUT_ID}
              inputPath: ${INPUT_PATH}
              selectionMode: AUTO
          codecConfigId: $/configurations/video/h264/v-480p
          mode: STANDARD
    muxings:
      fmp4:
        m-360p:
          properties:
            name: video 360p fmp4
            streams:
              - streamId: $/encodings/main/streams/s-360p
            outputs:
              - outputId: ${OUTPUT_ID}
                outputPath: "test-streams/vod-baseline/video/360p/"
                acl:
                  - permission: PUBLIC_READ
            initSegmentName: init.mp4
            segmentLength: 4.0
            segmentNaming: "seg_%number%.m4s"
        m-480p:
          properties:
            name: video 480p fmp4
            streams:
              - streamId: $/encodings/main/streams/s-480p
            outputs:
              - outputId: ${OUTPUT_ID}
                outputPath: "test-streams/vod-baseline/video/480p/"
                acl:
                  - permission: PUBLIC_READ
            initSegmentName: init.mp4
            segmentLength: 4.0
            segmentNaming: "seg_%number%.m4s"
    start:
      properties:
        encodingMode: SINGLE_PASS
        manifestGenerator: V2
        vodDashManifests:
          - manifestId: $/manifests/dash/defaultapi/default-dash
        vodHlsManifests:
          - manifestId: $/manifests/hls/defaultapi/default-hls

manifests:
  dash:
    defaultapi:
      default-dash:
        properties:
          encodingId: $/encodings/main
          name: vod-baseline DASH
          manifestName: manifest.mpd
          profile: ON_DEMAND
          outputs:
            - outputId: ${OUTPUT_ID}
              outputPath: "test-streams/vod-baseline/"
              acl:
                - permission: PUBLIC_READ
          generatorVersion: V2
  hls:
    defaultapi:
      default-hls:
        properties:
          encodingId: $/encodings/main
          name: vod-baseline HLS
          manifestName: master.m3u8
          outputs:
            - outputId: ${OUTPUT_ID}
              outputPath: "test-streams/vod-baseline/"
              acl:
                - permission: PUBLIC_READ
          generatorVersion: V2
