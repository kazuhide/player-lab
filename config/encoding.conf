# Committed, non-secret encoding configuration — the "what" of the test streams.
# Secrets and account-specific values (API key, S3 bucket + credentials, license
# keys) live in the untracked repo-root .env — see .env.example / docs/SETUP.md.
#
# Plain KEY=VALUE. Consumed by encoding/lib.sh (bash) and
# encoding/vod-multicodec-pertitle/multicodec_pertitle.py (python).
# Precedence: environment > .env > this file (files never override the env).

# ── Output storage — resolved by NAME at run time, never by a committed id ──
# The Bitmovin S3 output resource every encode writes to. The scripts look it
# up by this name and create it from BITMOVIN_OUTPUT_* (.env) only when it
# doesn't exist yet ("bootstrap once, reference by name").
BITMOVIN_OUTPUT_NAME=player-lab-output

# ── Test-source catalog ─────────────────────────────────────────────────────
# Per-scenario source clips (public, encoder-fetchable over HTTPS). Keys:
#   SOURCE_<SCENARIO>_HOST / _PATH        (scenario name: `-` → `_`, uppercased)
#   SOURCE_<SCENARIO>_AUDIO2_HOST/_PATH   (scenarios with a 2nd audio source)
# _HOST falls back to SOURCE_DEFAULT_HOST. These are the recommended defaults
# for (re-)provisioning; a one-off override still works via the environment
# (SOURCE_HOST= / INPUT_PATH= / AUDIO2_HOST= / INPUT_PATH2=).
SOURCE_DEFAULT_HOST=test-videos.co.uk

# vod-baseline — H.264 ABR ladder (video-only 10s BBB clip is enough)
SOURCE_VOD_BASELINE_PATH=/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4

# vod-hevc — H.265 (hvc1) 480p; video-only is fine
SOURCE_VOD_HEVC_PATH=/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4

# vod-sprites — sprite sheet + WebVTT; a longer clip gives the scrubber real tiles
SOURCE_VOD_SPRITES_HOST=media.w3.org
SOURCE_VOD_SPRITES_PATH=/2010/05/sintel/trailer.mp4

# vod-multiaudio — video+en from one source, de from a second one. Both must
# carry an audio stream (the small test-videos.co.uk BBB clips are video-only —
# see docs/test-streams-config.md).
SOURCE_VOD_MULTIAUDIO_HOST=download.samplelib.com
SOURCE_VOD_MULTIAUDIO_PATH=/mp4/sample-30s.mp4
SOURCE_VOD_MULTIAUDIO_AUDIO2_HOST=media.w3.org
SOURCE_VOD_MULTIAUDIO_AUDIO2_PATH=/2010/05/sintel/trailer.mp4

# vod-multicodec-pertitle — three Per-Title encodes (H.264/HEVC/AV1) + one shared
# AAC track; needs an audio-bearing source (the AAC rides in the H.264 job).
SOURCE_VOD_MULTICODEC_PERTITLE_HOST=media.w3.org
SOURCE_VOD_MULTICODEC_PERTITLE_PATH=/2010/05/sintel/trailer.mp4
