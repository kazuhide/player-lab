# Keep default detectors. This SDK export initialization is JavaScript, not a key.
# https://github.com/gitleaks/gitleaks/blob/v8.30.1/README.md#configuration
[extend]
useDefault = true

[[allowlists]]
description = "Bitmovin Player undefined export initialization"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)web/assets/(?:main|bitmovin8-shared)-[A-Za-z0-9_-]{8,}\.js$''']
regexTarget = "match"
regexes = ['''^[A-Za-z_$]\.getEncryptionKey=[A-Za-z_$]\.getAllEncryptionKeys=void\s*$''']
